<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modern Success Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      min-height: 100vh;
      background: #121212;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* الحاوي الرئيسي للكتاب على الموبايل (صفحات تحت بعض بملء الشاشة) */
    .book-container {
      width: 100vw;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* كل صفحة تأخذ شاشة الموبايل بالكامل */
    .book-page {
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      position: relative;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 5px solid #000;
      overflow: hidden;
    }

    /* الغلاف أو الصور تملأ الصفحة بالكامل وبدون قص */
    .page-full-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* محتوى الأسبوع والباسورد */
    .week-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #161616;
      padding: 20px;
      position: relative;
    }

    h2.week-title {
      color: #e0e0e0;
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .lock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 85%;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      border-radius: 8px;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 15px;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #888;
    }

    .unlock-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* صورة الرسالة التي تظهر بعد الباسورد وتملأ الشاشة تماماً */
    .message-img {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #161616;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="book-container" id="book">
    
    <div class="book-page">
      <img src="a.jpeg" class="page-full-img" alt="Cover">
    </div>

    <div class="book-page">
      <img src="s.jpeg" class="page-full-img" alt="Static Page">
    </div>

  </div>

  <script>
    const weeksData = [
      { pass: "2027", msgImg: "msg1.jpeg" },
      { pass: "lawyer", msgImg: "msg2.jpeg" },
      { pass: "3", msgImg: "msg3.jpeg" }
    ];

    const totalWeeks = 40;
    const container = document.getElementById("book");

    // توليد الأسابيع تباعاً لتنزل بسلاسة على الموبايل
    for (let i = 1; i <= totalWeeks; i++) {
      const data = weeksData[i - 1] || { pass: `week${i}`, msgImg: `msg${i}.jpeg` };

      const weekPage = document.createElement("div");
      weekPage.className = "book-page";
      weekPage.innerHTML = `
        <div class="week-content" id="week-box-${i}">
          <h2 class="week-title">WEEK ${i}</h2>
          <div class="lock-container" id="lock-box-${i}">
            <input type="password" id="pass-${i}" placeholder="Enter Password" autocomplete="off">
            <button class="unlock-btn" onclick="unlockMsg(${i}, '${data.pass}')">ENTER</button>
          </div>
          <img src="${data.msgImg}" class="message-img" id="msg-img-${i}" alt="Message">
        </div>
      `;
      container.appendChild(weekPage);
    }

    // صفحة التخرج الأخيرة
    const gradPage = document.createElement("div");
    gradPage.className = "book-page";
    gradPage.innerHTML = `
      <div class="week-content" style="background:#111;">
        <h2 class="week-title" style="color:#d4af37;">GRADUATION 2027</h2>
        <div class="lock-container" id="lock-box-grad">
          <input type="password" id="pass-grad" placeholder="Password" autocomplete="off">
          <button class="unlock-btn" style="background:#8b0000; border-color:#d4af37;" onclick="unlockGrad()">ENTER</button>
        </div>
        <img src="msg-grad.jpeg" class="message-img" id="msg-img-grad" alt="Graduation">
      </div>
    `;
    container.appendChild(gradPage);

    // تفعيل مفتاح Enter
    document.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        const activeInput = document.activeElement;
        if (activeInput && activeInput.tagName === "INPUT") {
          if (activeInput.id === "pass-grad") {
            unlockGrad();
          } else {
            const weekNum = activeInput.id.replace("pass-", "");
            const data = weeksData[weekNum - 1] || { pass: `week${weekNum}` };
            unlockMsg(Number(weekNum), data.pass);
          }
        }
      }
    });

    function unlockMsg(weekNum, correctPass) {
      const input = document.getElementById(`pass-${weekNum}`);
      if (input.value === correctPass) {
        document.getElementById(`lock-box-${weekNum}`).style.display = 'none';
        document.getElementById(`msg-img-${weekNum}`).style.display = 'block';
      } else {
        alert('Wrong Password!');
      }
    }

    function unlockGrad() {
      const input = document.getElementById("pass-grad");
      if (input.value === "graduation") {
        document.getElementById("lock-box-grad").style.display = 'none';
        document.getElementById("msg-img-grad").style.display = 'block';
      } else {
        alert('Wrong Password!');
      }
    }
  </script>

</body>

</html>
